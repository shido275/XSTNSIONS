name: Build and publish installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to attach installers to, such as v0.1.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-universal
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libgl1-mesa-dev libjack-jackd2-dev dpkg-dev

      - name: Install Windows packaging tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$RELEASE_TAG" ]; then VERSION="0.1.0"; fi
          GENERATOR_ARGS=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            GENERATOR_ARGS=(-G "Visual Studio 17 2022" -A x64)
          else
            GENERATOR_ARGS=(-G Ninja)
          fi
          PLATFORM_ARGS=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            PLATFORM_ARGS+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64")
          fi
          cmake -S . -B build "${GENERATOR_ARGS[@]}" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DXSTNSIONS_BUILD_PLUGINS=ON -DXSTNSIONS_PACKAGE_VERSION="$VERSION" "${PLATFORM_ARGS[@]}"
          echo "XSTNSIONS release version: $VERSION"

      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build --config Release --parallel 2 > build.log 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            grep -E -A 3 -B 2 'error:|fatal error:|undefined reference|unresolved external' build.log | tail -n 80 || tail -n 80 build.log
            exit "$build_status"
          fi
          tail -n 40 build.log

      - name: Run engine tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginDirs = Get-ChildItem build -Directory -Recurse -Filter '*.vst3' | Where-Object { $_.Name -in @('XSTNSIONS Instrument.vst3', 'XSTNSIONS Effect.vst3') }
          if ($pluginDirs.Count -ne 2) { throw "Expected both VST3 bundles, found $($pluginDirs.Count)." }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $pluginRoot = Join-Path (Resolve-Path build).Path 'installer-plugins'
          Remove-Item -Path $pluginRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pluginRoot | Out-Null
          foreach ($pluginDir in $pluginDirs) {
            $stagedPlugin = Join-Path $pluginRoot $pluginDir.Name
            New-Item -ItemType Directory -Force -Path $stagedPlugin | Out-Null
            Copy-Item -Path (Join-Path $pluginDir.FullName '*') -Destination $stagedPlugin -Recurse -Force
          }
          foreach ($expectedPlugin in @('XSTNSIONS Instrument.vst3', 'XSTNSIONS Effect.vst3')) {
            if (-not (Test-Path (Join-Path $pluginRoot $expectedPlugin))) { throw "Failed to stage $expectedPlugin." }
          }
          $pluginRoot = (Resolve-Path $pluginRoot).Path.Replace([char]92, '/')
          $installer = "dist/XSTNSIONS-$env:RELEASE_TAG-windows-x64-setup.exe"
          $nsi = @'
          !define SOURCE_DIR "@SOURCE_DIR@"
          Name "XSTNSIONS @VERSION@"
          OutFile "@OUT_FILE@"
          InstallDir "$COMMONFILES64\VST3"
          RequestExecutionLevel admin
          SetCompressor /SOLID lzma

          Section "Install XSTNSIONS VST3 plugins"
            SetOutPath "$COMMONFILES64\VST3/XSTNSIONS Instrument.vst3"
            File /r "${SOURCE_DIR}/XSTNSIONS Instrument.vst3/*"
            SetOutPath "$COMMONFILES64\VST3/XSTNSIONS Effect.vst3"
            File /r "${SOURCE_DIR}/XSTNSIONS Effect.vst3/*"
          SectionEnd

          Section "Uninstall"
            RMDir /r "$COMMONFILES64\VST3/XSTNSIONS Instrument.vst3"
            RMDir /r "$COMMONFILES64\VST3/XSTNSIONS Effect.vst3"
          SectionEnd
          '@
          $nsi = $nsi.Replace('@SOURCE_DIR@', $pluginRoot).Replace('@OUT_FILE@', $installer).Replace('@VERSION@', $env:RELEASE_TAG)
          Set-Content -Path build/installer.nsi -Value $nsi -Encoding ascii
          & makensis /V2 build/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS exited with code $LASTEXITCODE." }
          if (-not (Test-Path $installer)) { throw 'NSIS did not produce the Windows installer.' }

      - name: Package macOS installer disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target package
          mkdir -p dist
          pkg="$(find build -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$pkg"
          cp "$pkg" "dist/XSTNSIONS-${RELEASE_TAG}-macos-universal.dmg"
          hdiutil verify "dist/XSTNSIONS-${RELEASE_TAG}-macos-universal.dmg"

      - name: Package Linux Debian installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package_root="$PWD/package-root"
          vst3_dir="$package_root/usr/lib/vst3"
          mkdir -p "$vst3_dir" "$package_root/DEBIAN" dist
          while IFS= read -r -d '' plugin; do
            cp -a "$plugin" "$vst3_dir/"
          done < <(find build -type d -name '*.vst3' -print0)
          test "$(find "$vst3_dir" -mindepth 1 -maxdepth 1 -type d -name '*.vst3' | wc -l)" -eq 2
          test "$(find "$vst3_dir" -type f -name '*.so' | wc -l)" -eq 2
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: xstnsions
          Version: ${RELEASE_TAG#v}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: XSTNSIONS Audio
          Depends: libc6, libstdc++6, libfontconfig1, libfreetype6
          Description: A modular instrument and effect audio plug-in
           Includes XSTNSIONS Instrument and Effect VST3 plug-ins.
          EOF
          dpkg-deb --build --root-owner-group "$package_root" "dist/XSTNSIONS-${RELEASE_TAG}-linux-x64.deb"
          dpkg-deb --info "dist/XSTNSIONS-${RELEASE_TAG}-linux-x64.deb"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: Create checksums
        run: |
          set -eu
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish installers on the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
